name: Daily Build

on:
  schedule:
    - cron: '30 8 * * *'
  workflow_dispatch:
    inputs:
      qcom_build_run_id:
        description: Successful qcom-deb-images Build run ID; empty selects the latest
        required: false
        type: string
      suite:
        description: Debian suite used for the LAVA image
        required: true
        default: trixie
        type: choice
        options:
          - trixie
          - forky

permissions: {}

concurrency:
  group: daily-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-qcom-image:
    if: >-
      github.repository == 'qualcomm-linux/aiml-container-test' &&
      (github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main')
    uses: ./.github/workflows/resolve-qcom-image.yml
    permissions:
      contents: read
    with:
      run_id: ${{ inputs.qcom_build_run_id }}

  build-daily:
    name: Build AIML container
    needs: resolve-qcom-image
    uses: ./.github/workflows/docker_build.yml
    permissions:
      contents: read
    with:
      create_test_url: true

  test-daily:
    name: Test AIML container in LAVA
    needs:
      - resolve-qcom-image
      - build-daily
    uses: ./.github/workflows/lava-test.yml
    permissions:
      actions: read
      checks: write
      contents: read
      packages: read
      pull-requests: write
    secrets:
      LAVATOKEN: ${{ secrets.LAVATOKEN }}
    with:
      build_url: ${{ needs.resolve-qcom-image.outputs.build_url }}
      suite: ${{ inputs.suite || 'trixie' }}
