name: Tests

on:
  workflow_call:
    inputs:
      build_url:
        description: Immutable qcom-deb-images artifact prefix
        required: true
        type: string
      container_digest:
        description: Content digest of the tested container image
        required: true
        type: string
      qcom_event:
        description: qcom-deb-images workflow event
        required: true
        type: string
      qcom_ref:
        description: qcom-deb-images branch
        required: true
        type: string
      qcom_run_attempt:
        description: qcom-deb-images workflow run attempt
        required: true
        type: string
      qcom_publication_attempt:
        description: qcom-deb-images artifact publication attempt
        required: true
        type: string
      qcom_run_id:
        description: qcom-deb-images workflow run ID
        required: true
        type: string
      qcom_sha:
        description: qcom-deb-images commit
        required: true
        type: string
      qcom_workflow:
        description: qcom-deb-images workflow path
        required: true
        type: string
      suite:
        description: Debian suite used for the LAVA image
        required: true
        type: string
      image_source:
        description: qcom-deb-images workflow family used by the selected boards
        required: true
        type: string
      report_scope:
        description: Unique report and artifact namespace
        required: true
        type: string
      boards_include:
        description: JSON array of board names to include; empty selects boards for image_source
        required: false
        type: string
        default: ''
    secrets:
      LAVATOKEN:
        description: API token used to submit jobs to LAVA
        required: true

permissions: {}

env:
  BOARDS_INCLUDE: ${{ inputs.boards_include }}
  BUILD_URL: ${{ inputs.build_url }}
  IMAGE_SOURCE: ${{ inputs.image_source }}
  LAVA_CI: ci/lava/
  REPORT_SCOPE: ${{ inputs.report_scope }}
  SUITE: ${{ inputs.suite }}

jobs:
  prepare-job-list:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      jobmatrix: ${{ steps.listjobs.outputs.jobmatrix }}
      has_jobs: ${{ steps.listjobs.outputs.has_jobs }}
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Print trigger
        run: |
          echo "Triggered by ${{ github.event_name }}"
          echo "Build URL: $BUILD_URL"
      - name: Validate board routing
        id: boards
        run: |
          python3 ci/select_lava_boards.py \
            --boards ci/boards.json \
            --lava-dir "$LAVA_CI" \
            --image-source "$IMAGE_SOURCE" \
            --include "$BOARDS_INCLUDE" \
            --github-output "$GITHUB_OUTPUT"
      - name: "List jobs"
        id: listjobs
        env:
          SELECTED_BOARDS: ${{ steps.boards.outputs.boards }}
        run: |
          [[ "$REPORT_SCOPE" =~ ^[a-z0-9-]+$ ]]
          # json with display names and relative filenames to LAVA templates
          J=$(find "${LAVA_CI}" -name '*.yaml' -print0 |
                  jq --compact-output --raw-input --slurp \
                      --argjson include "$SELECTED_BOARDS" '
                      # split null-delimited list and remove last empty item
                      split("\u0000")[:-1]
                      # remove leading "ci/lava/"
                      | map(sub("^ci/lava/"; ""))
                      # build include entries with target and pretty name
                      | map({
                          board: split("/")[0],
                          target: .,
                          slug: (
                              .
                              | sub("\\.yaml$"; "")
                              | gsub("/"; "-")
                          ),
                          name: (
                              .
                              | sub("\\.yaml$"; "")
                              | gsub("/"; " ")
                          )
                        })
                      | map(select(.board as $b | $include | any(. == $b)))
                      | map(del(.board))
                      # output as matrix.include list
                      | { include: . }
                      ')
          echo "jobmatrix=$J" >>"$GITHUB_OUTPUT"
          echo "has_jobs=$(echo "$J" | jq '.include | length > 0')" >>"$GITHUB_OUTPUT"
          echo "Preparing testjob files"

  submit-job:
    needs: prepare-job-list
    if: needs.prepare-job-list.outputs.has_jobs == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    name: Submit ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-job-list.outputs.jobmatrix) }}
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Download short-lived container URL
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: container-test-url-${{ github.run_id }}
          path: container-url

      - name: Update test definition ${{ matrix.target }}
        env:
          TEMPLATE: ${{ env.LAVA_CI }}${{ matrix.target }}
        run: |
          set -euo pipefail
          export CONTAINER_URL
          CONTAINER_URL="$(<container-url/container_url)"
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          from urllib.parse import parse_qs, urlsplit

          url = os.environ["CONTAINER_URL"]
          parsed = urlsplit(url)
          valid_host = (
              parsed.hostname == "qcom-prd-gh-artifacts.s3.amazonaws.com"
              or (
                  parsed.hostname is not None
                  and parsed.hostname.startswith("qcom-prd-gh-artifacts.s3.")
                  and parsed.hostname.endswith(".amazonaws.com")
              )
          )
          path_match = re.fullmatch(
              rf"/{re.escape(os.environ['GITHUB_REPOSITORY'])}/"
              rf"{re.escape(os.environ['GITHUB_RUN_ID'])}-([1-9][0-9]*)/"
              r"aiml-container-test-repository\.tar\.gz",
              parsed.path,
          )
          query = parse_qs(parsed.query)
          if (
              parsed.scheme != "https"
              or not valid_host
              or path_match is None
              or int(path_match.group(1)) > int(os.environ["GITHUB_RUN_ATTEMPT"])
              or "X-Amz-Signature" not in query
              or int(query.get("X-Amz-Expires", ["0"])[0]) > 21600
          ):
              raise SystemExit("container URL failed validation")

          replacements = {
              "{{BUILD_DOWNLOAD_URL}}": os.environ["BUILD_URL"],
              "{{CONTAINER_URL}}": url,
              "{{SUITE}}": os.environ["SUITE"],
              "{{GITHUB_REPOSITORY}}": os.environ["GITHUB_REPOSITORY"],
              "{{GITHUB_RUN_ATTEMPT}}": os.environ["GITHUB_RUN_ATTEMPT"],
              "{{GITHUB_RUN_ID}}": os.environ["GITHUB_RUN_ID"],
              "{{GITHUB_SHA}}": os.environ["GITHUB_SHA"],
          }
          template = Path(os.environ["TEMPLATE"])
          contents = template.read_text()
          for placeholder, value in replacements.items():
              if placeholder not in contents:
                  raise SystemExit(f"missing expected placeholder: {placeholder}")
              contents = contents.replace(placeholder, value)
          unresolved = re.findall(r"{{[^{}]+}}", contents)
          if unresolved:
              raise SystemExit(f"unresolved placeholders: {', '.join(unresolved)}")
          template.write_text(contents)
          PY
          echo "Prepared validated LAVA definition at $TEMPLATE"

      - name: Submit ${{ matrix.target }}
        id: lava_attempt
        continue-on-error: true
        timeout-minutes: 240
        uses: foundriesio/lava-action@3d40f621e0cd5acec50f557783b755f278ca892d # v13
        with:
          lava_token: ${{ secrets.LAVATOKEN }}
          lava_url: 'lava.infra.foundries.io'
          job_definition: ${{ env.LAVA_CI }}${{ matrix.target }}
          wait_for_job: true
          fail_action_on_failure: true
          fail_action_on_incomplete: true
          save_result_as_artifact: true
          save_job_details: true
          result_file_name: test-results-${{ inputs.suite }}-${{ inputs.report_scope }}-${{ matrix.slug }}
          test_job_file_name_prefix: ${{ inputs.suite }}-${{ github.run_attempt }}-${{ inputs.report_scope }}-

      - name: Check whether AIML tests ran
        id: first_execution
        if: always()
        continue-on-error: true
        env:
          RESULT_FILE: test-results-${{ inputs.suite }}-${{ inputs.report_scope }}-${{ matrix.slug }}.xml
        run: python3 ci/check_lava_execution.py "$RESULT_FILE"

      - name: Retry ${{ matrix.target }}
        if: steps.first_execution.outcome == 'failure'
        timeout-minutes: 240
        uses: foundriesio/lava-action@3d40f621e0cd5acec50f557783b755f278ca892d # v13
        with:
          lava_token: ${{ secrets.LAVATOKEN }}
          lava_url: 'lava.infra.foundries.io'
          job_definition: ${{ env.LAVA_CI }}${{ matrix.target }}
          wait_for_job: true
          fail_action_on_failure: true
          fail_action_on_incomplete: true
          save_result_as_artifact: true
          save_job_details: true
          result_file_name: test-results-${{ inputs.suite }}-${{ inputs.report_scope }}-${{ matrix.slug }}
          test_job_file_name_prefix: ${{ inputs.suite }}-${{ github.run_attempt }}-${{ inputs.report_scope }}-

      - name: Preserve executed test failures
        if: always() && steps.lava_attempt.outcome == 'failure' && steps.first_execution.outcome == 'success'
        run: |
          echo "AIML tests ran, but the LAVA job reported a test failure" >&2
          exit 1

      - name: Require AIML test execution
        if: always()
        env:
          RESULT_FILE: test-results-${{ inputs.suite }}-${{ inputs.report_scope }}-${{ matrix.slug }}.xml
        run: python3 ci/check_lava_execution.py "$RESULT_FILE"

  publish-test-results:
    name: Publish Tests Results
    needs: submit-job
    if: always() && needs.submit-job.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: write
      contents: read
      packages: read

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Download test results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: test-results-${{ inputs.suite }}-${{ inputs.report_scope }}-*

      - name: Download job details
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: ${{ inputs.suite }}-${{ github.run_attempt }}-${{ inputs.report_scope }}-test-job-*

      - name: List files
        run: |
          echo $GITHUB_WORKSPACE
          ls -R $GITHUB_WORKSPACE

      - name: Download LAVA measurements and logs
        id: lava_data
        env:
          LAVA_TOKEN: ${{ secrets.LAVATOKEN }}
        run: |
          set -euo pipefail
          mkdir -p report-input
          job_count=0
          while IFS= read -r -d '' json_file; do
            job_id=$(jq -er '.id' "$json_file")
            [[ "$job_id" =~ ^[0-9]+$ ]]
            curl_args=(
              --fail
              --silent
              --show-error
              --retry 3
              --header "Authorization: Token ${LAVA_TOKEN}"
            )
            curl "${curl_args[@]}" \
              "https://lava.infra.foundries.io/api/v0.2/jobs/${job_id}/" \
              --output "report-input/job-${job_id}.json"
            curl "${curl_args[@]}" \
              "https://lava.infra.foundries.io/api/v0.2/jobs/${job_id}/csv/" \
              --output "report-input/job-${job_id}-tests.csv"
            curl "${curl_args[@]}" \
              "https://lava.infra.foundries.io/api/v0.2/jobs/${job_id}/logs/" \
              --output "report-input/job-${job_id}.yaml"
            job_count=$((job_count + 1))
          done < <(find artifacts -type f -name '*test-job-*.json' -print0)
          (( job_count > 0 ))
          board_key=$(
            jq -r --slurpfile metadata ci/boards.json '
              .requested_device_type as $device_type
              | $metadata[0].boards
              | to_entries[]
              | select(.value.device_types | index($device_type))
              | .key
            ' report-input/job-*.json |
              sort -u |
              paste -sd+ -
          )
          [[ "$board_key" =~ ^[a-z0-9_-]+(\+[a-z0-9_-]+)*$ ]]
          echo "board_key=$board_key" >>"$GITHUB_OUTPUT"

      - name: Download previous performance report
        env:
          BOARD_KEY: ${{ steps.lava_data.outputs.board_key }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_name="tflite-performance-${SUITE}-${REPORT_SCOPE}-${BOARD_KEY}"
          ref_name="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          artifacts=$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts" \
            -f name="$artifact_name" \
            -f per_page=100)
          mapfile -t candidates < <(jq -r \
            --arg branch "$ref_name" \
            --argjson run_id "$GITHUB_RUN_ID" '
              [.artifacts[]
                | select(.expired == false)
                | select(.workflow_run.id < $run_id)
                | select(.workflow_run.head_branch == $branch)]
              | sort_by(.created_at)
              | reverse
              | .[]
              | [.id, .workflow_run.id]
              | @tsv
            ' <<<"$artifacts")

          selected_run_id=""
          rm -rf previous-candidate previous-report previous-report.zip
          for candidate in "${candidates[@]}"; do
            read -r artifact_id run_id <<<"$candidate"
            if ! gh api \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
              >previous-report.zip; then
              echo "::warning::Could not download performance report from run ${run_id}"
              rm -f previous-report.zip
              continue
            fi

            mkdir previous-candidate
            if ! unzip -q previous-report.zip -d previous-candidate; then
              echo "::warning::Could not unpack performance report from run ${run_id}"
              rm -rf previous-candidate previous-report.zip
              continue
            fi
            if [[ -s previous-candidate/results.json ]] && jq -e '
              (.boards | length) > 0
              and all(
                .boards[];
                any(
                  .results[];
                  .result == "pass" and .measurement != null
                )
              )
            ' previous-candidate/results.json >/dev/null; then
              mv previous-candidate previous-report
              selected_run_id="$run_id"
              echo "Using previous performance report from run ${run_id}"
              break
            fi
            echo "Skipping report from run ${run_id}: no complete board measurements"
            rm -rf previous-candidate previous-report.zip
          done

          if [[ -z "$selected_run_id" ]]; then
            echo "No previous performance report found for ${ref_name}"
          fi

      - name: Generate performance report
        env:
          AIML_REF: ${{ github.head_ref || github.ref_name }}
          CONTAINER_DIGEST: ${{ inputs.container_digest }}
          QCOM_EVENT: ${{ inputs.qcom_event }}
          QCOM_REF: ${{ inputs.qcom_ref }}
          QCOM_RUN_ATTEMPT: ${{ inputs.qcom_run_attempt }}
          QCOM_PUBLICATION_ATTEMPT: ${{ inputs.qcom_publication_attempt }}
          QCOM_RUN_ID: ${{ inputs.qcom_run_id }}
          QCOM_SHA: ${{ inputs.qcom_sha }}
          QCOM_WORKFLOW: ${{ inputs.qcom_workflow }}
        run: |
          set -euo pipefail
          previous_args=()
          if [[ -s previous-report/results.json ]]; then
            previous_args+=(--previous-results previous-report/results.json)
          fi
          python3 ci/report_lava_results.py \
            --input-dir report-input \
            --output-dir performance-results \
            --boards ci/boards.json \
            --suite "$SUITE" \
            --lava-url https://lava.infra.foundries.io \
            --qcom-run-id "$QCOM_RUN_ID" \
            --qcom-run-attempt "$QCOM_RUN_ATTEMPT" \
            --qcom-publication-attempt "$QCOM_PUBLICATION_ATTEMPT" \
            --qcom-workflow "$QCOM_WORKFLOW" \
            --qcom-event "$QCOM_EVENT" \
            --qcom-ref "$QCOM_REF" \
            --qcom-sha "$QCOM_SHA" \
            --aiml-repository "$GITHUB_REPOSITORY" \
            --aiml-ref "$AIML_REF" \
            --aiml-sha "$GITHUB_SHA" \
            --aiml-run-id "$GITHUB_RUN_ID" \
            --aiml-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --container-digest "$CONTAINER_DIGEST" \
            "${previous_args[@]}"
          cat performance-results/summary.md >>"$GITHUB_STEP_SUMMARY"

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
        with:
          check_name: LAVA results (${{ inputs.report_scope }})
          comment_mode: 'off'
          compare_to_earlier_commit: 'false'
          files: "${{ github.workspace }}/artifacts/**/*.xml"
          job_summary: 'false'
          json_file: performance-results/test-results.json

      - name: Format Test Results
        run: |
          python3 ci/format_test_results.py \
            --performance-summary performance-results/summary.md \
            --test-results performance-results/test-results.json \
            --output performance-results/check-summary.md

      - name: Update Test Results check
        env:
          CHECK_NAME: LAVA results (${{ inputs.report_scope }})
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          check_runs=$(
            gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" \
              -f check_name="$CHECK_NAME" \
              -f filter=latest \
              -f per_page=10
          )
          check_run_id=$(jq -er '.check_runs[0].id' <<<"$check_runs")
          jq -e --rawfile summary performance-results/check-summary.md '
            {
              output: {
                title: (
                  .check_runs[0].output.title
                  | select(type == "string" and length > 0)
                ),
                summary: $summary
              }
            }
          ' <<<"$check_runs" >"${RUNNER_TEMP}/check-update.json"
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/check-runs/${check_run_id}" \
            --input "${RUNNER_TEMP}/check-update.json"

      - name: Upload performance report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tflite-performance-${{ inputs.suite }}-${{ inputs.report_scope }}-${{ steps.lava_data.outputs.board_key }}
          path: performance-results
          retention-days: 90
          if-no-files-found: error
          overwrite: true

      - name: Publish Test Job Details
        run: |
          for json_file in $(find "${{ github.workspace }}" -name "*test-job-*.json")
          do
              DEVICE_TYPE=$(cat "$json_file" | jq -r ".requested_device_type")
              URL=$(cat "$json_file" | jq -r ".url")
              JOB_ID=$(cat "$json_file" | jq -r ".id")
              echo " * [Job $JOB_ID on $DEVICE_TYPE]($URL)"
              echo " * [Job $JOB_ID on $DEVICE_TYPE]($URL)" >> $GITHUB_STEP_SUMMARY
          done
