name: Tests

on:
  workflow_call:
    inputs:
      build_url:
        description: Immutable qcom-deb-images artifact prefix
        required: true
        type: string
      container_digest:
        description: Content digest of the tested container image
        required: true
        type: string
      qcom_event:
        description: qcom-deb-images workflow event
        required: true
        type: string
      qcom_ref:
        description: qcom-deb-images branch
        required: true
        type: string
      qcom_run_attempt:
        description: qcom-deb-images workflow run attempt
        required: true
        type: string
      qcom_publication_attempt:
        description: qcom-deb-images artifact publication attempt
        required: true
        type: string
      qcom_run_id:
        description: qcom-deb-images workflow run ID
        required: true
        type: string
      qcom_sha:
        description: qcom-deb-images commit
        required: true
        type: string
      qcom_workflow:
        description: qcom-deb-images workflow path
        required: true
        type: string
      suite:
        description: Debian suite used for the LAVA image
        required: true
        type: string
      image_source:
        description: qcom-deb-images workflow family used by the selected boards
        required: true
        type: string
      report_scope:
        description: Report and artifact namespace (generic or arduino)
        required: true
        type: string
      boards_include:
        description: JSON array of board names to include; empty selects boards for image_source
        required: false
        type: string
        default: ''
      additional_build_url:
        description: Immutable qcom-deb-images artifact prefix for an additional report scope
        required: false
        type: string
        default: ''
      additional_boards_include:
        description: JSON array of boards for the additional report scope
        required: false
        type: string
        default: ''
      additional_image_source:
        description: qcom-deb-images workflow family for the additional report scope
        required: false
        type: string
        default: ''
      additional_qcom_event:
        description: qcom-deb-images workflow event for the additional report scope
        required: false
        type: string
        default: ''
      additional_qcom_ref:
        description: qcom-deb-images branch for the additional report scope
        required: false
        type: string
        default: ''
      additional_qcom_run_attempt:
        description: qcom-deb-images workflow run attempt for the additional report scope
        required: false
        type: string
        default: ''
      additional_qcom_publication_attempt:
        description: qcom-deb-images publication attempt for the additional report scope
        required: false
        type: string
        default: ''
      additional_qcom_run_id:
        description: qcom-deb-images workflow run ID for the additional report scope
        required: false
        type: string
        default: ''
      additional_qcom_sha:
        description: qcom-deb-images commit for the additional report scope
        required: false
        type: string
        default: ''
      additional_qcom_workflow:
        description: qcom-deb-images workflow path for the additional report scope
        required: false
        type: string
        default: ''
      additional_report_scope:
        description: Additional report namespace (generic or arduino)
        required: false
        type: string
        default: ''
    secrets:
      LAVATOKEN:
        description: API token used to submit jobs to LAVA
        required: true

permissions: {}

env:
  LAVA_CI: ci/lava/
  SUITE: ${{ inputs.suite }}

jobs:
  prepare-job-list:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      jobmatrix: ${{ steps.listjobs.outputs.jobmatrix }}
      has_jobs: ${{ steps.listjobs.outputs.has_jobs }}
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Print trigger
        run: |
          echo "Triggered by ${{ github.event_name }}"
      - name: Build scoped job matrix
        id: listjobs
        env:
          PRIMARY_BOARDS_INCLUDE: ${{ inputs.boards_include }}
          PRIMARY_BUILD_URL: ${{ inputs.build_url }}
          PRIMARY_IMAGE_SOURCE: ${{ inputs.image_source }}
          PRIMARY_QCOM_EVENT: ${{ inputs.qcom_event }}
          PRIMARY_QCOM_REF: ${{ inputs.qcom_ref }}
          PRIMARY_QCOM_RUN_ATTEMPT: ${{ inputs.qcom_run_attempt }}
          PRIMARY_QCOM_PUBLICATION_ATTEMPT: ${{ inputs.qcom_publication_attempt }}
          PRIMARY_QCOM_RUN_ID: ${{ inputs.qcom_run_id }}
          PRIMARY_QCOM_SHA: ${{ inputs.qcom_sha }}
          PRIMARY_QCOM_WORKFLOW: ${{ inputs.qcom_workflow }}
          PRIMARY_REPORT_SCOPE: ${{ inputs.report_scope }}
          ADDITIONAL_BOARDS_INCLUDE: ${{ inputs.additional_boards_include }}
          ADDITIONAL_BUILD_URL: ${{ inputs.additional_build_url }}
          ADDITIONAL_IMAGE_SOURCE: ${{ inputs.additional_image_source }}
          ADDITIONAL_QCOM_EVENT: ${{ inputs.additional_qcom_event }}
          ADDITIONAL_QCOM_REF: ${{ inputs.additional_qcom_ref }}
          ADDITIONAL_QCOM_RUN_ATTEMPT: ${{ inputs.additional_qcom_run_attempt }}
          ADDITIONAL_QCOM_PUBLICATION_ATTEMPT: ${{ inputs.additional_qcom_publication_attempt }}
          ADDITIONAL_QCOM_RUN_ID: ${{ inputs.additional_qcom_run_id }}
          ADDITIONAL_QCOM_SHA: ${{ inputs.additional_qcom_sha }}
          ADDITIONAL_QCOM_WORKFLOW: ${{ inputs.additional_qcom_workflow }}
          ADDITIONAL_REPORT_SCOPE: ${{ inputs.additional_report_scope }}
        run: |
          set -euo pipefail
          if [[ -z "$ADDITIONAL_REPORT_SCOPE" ]] &&
             [[ -n "$ADDITIONAL_BOARDS_INCLUDE$ADDITIONAL_BUILD_URL$ADDITIONAL_IMAGE_SOURCE$ADDITIONAL_QCOM_EVENT$ADDITIONAL_QCOM_REF$ADDITIONAL_QCOM_RUN_ATTEMPT$ADDITIONAL_QCOM_PUBLICATION_ATTEMPT$ADDITIONAL_QCOM_RUN_ID$ADDITIONAL_QCOM_SHA$ADDITIONAL_QCOM_WORKFLOW" ]]; then
            echo "::error::additional scope metadata requires additional_report_scope" >&2
            exit 1
          fi
          if [[ -n "$ADDITIONAL_REPORT_SCOPE" ]] &&
             [[ "$PRIMARY_REPORT_SCOPE" != generic ||
                "$ADDITIONAL_REPORT_SCOPE" != arduino ]]; then
            echo "::error::only a generic report can aggregate the arduino scope" >&2
            exit 1
          fi
          # shellcheck disable=SC2016
          scope_specs=$(jq -cn \
            --arg boards_include "$PRIMARY_BOARDS_INCLUDE" \
            --arg build_url "$PRIMARY_BUILD_URL" \
            --arg image_source "$PRIMARY_IMAGE_SOURCE" \
            --arg qcom_event "$PRIMARY_QCOM_EVENT" \
            --arg qcom_ref "$PRIMARY_QCOM_REF" \
            --arg qcom_run_attempt "$PRIMARY_QCOM_RUN_ATTEMPT" \
            --arg qcom_publication_attempt "$PRIMARY_QCOM_PUBLICATION_ATTEMPT" \
            --arg qcom_run_id "$PRIMARY_QCOM_RUN_ID" \
            --arg qcom_sha "$PRIMARY_QCOM_SHA" \
            --arg qcom_workflow "$PRIMARY_QCOM_WORKFLOW" \
            --arg scope "$PRIMARY_REPORT_SCOPE" \
            --arg additional_boards_include "$ADDITIONAL_BOARDS_INCLUDE" \
            --arg additional_build_url "$ADDITIONAL_BUILD_URL" \
            --arg additional_image_source "$ADDITIONAL_IMAGE_SOURCE" \
            --arg additional_qcom_event "$ADDITIONAL_QCOM_EVENT" \
            --arg additional_qcom_ref "$ADDITIONAL_QCOM_REF" \
            --arg additional_qcom_run_attempt "$ADDITIONAL_QCOM_RUN_ATTEMPT" \
            --arg additional_qcom_publication_attempt "$ADDITIONAL_QCOM_PUBLICATION_ATTEMPT" \
            --arg additional_qcom_run_id "$ADDITIONAL_QCOM_RUN_ID" \
            --arg additional_qcom_sha "$ADDITIONAL_QCOM_SHA" \
            --arg additional_qcom_workflow "$ADDITIONAL_QCOM_WORKFLOW" \
            --arg additional_scope "$ADDITIONAL_REPORT_SCOPE" '
              {
                include: (
                  [
                  {
                    boards_include: $boards_include,
                    build_url: $build_url,
                    image_source: $image_source,
                    qcom_event: $qcom_event,
                    qcom_ref: $qcom_ref,
                    qcom_run_attempt: $qcom_run_attempt,
                    qcom_publication_attempt: $qcom_publication_attempt,
                    qcom_run_id: $qcom_run_id,
                    qcom_sha: $qcom_sha,
                    qcom_workflow: $qcom_workflow,
                    scope: $scope
                  }
                ] + (
                  if $additional_scope == "" then [] else [
                    {
                      boards_include: $additional_boards_include,
                      build_url: $additional_build_url,
                      image_source: $additional_image_source,
                      qcom_event: $additional_qcom_event,
                      qcom_ref: $additional_qcom_ref,
                      qcom_run_attempt: $additional_qcom_run_attempt,
                      qcom_publication_attempt: $additional_qcom_publication_attempt,
                      qcom_run_id: $additional_qcom_run_id,
                      qcom_sha: $additional_qcom_sha,
                      qcom_workflow: $additional_qcom_workflow,
                      scope: $additional_scope
                    }
                  ] end
                )
              )
              }
            ')
          jobmatrix='{"include":[]}'
          scopes='[]'
          while IFS= read -r scope_spec; do
            scope=$(jq -r '.scope' <<<"$scope_spec")
            [[ "$scope" =~ ^(generic|arduino)$ ]]
            jq -e '
              [
                .build_url,
                .image_source,
                .qcom_event,
                .qcom_ref,
                .qcom_run_attempt,
                .qcom_publication_attempt,
                .qcom_run_id,
                .qcom_sha,
                .qcom_workflow
              ] | all(type == "string" and length > 0)
            ' <<<"$scope_spec" >/dev/null
            # shellcheck disable=SC2016
            if jq -e --arg scope "$scope" \
              'any(.[]; .scope == $scope)' <<<"$scopes" >/dev/null; then
              echo "::error::duplicate report scope: ${scope}" >&2
              exit 1
            fi
            selected_boards=$(python3 ci/select_lava_boards.py \
              --boards ci/boards.json \
              --lava-dir "$LAVA_CI" \
              --image-source "$(jq -r '.image_source' <<<"$scope_spec")" \
              --include "$(jq -r '.boards_include' <<<"$scope_spec")")
            # shellcheck disable=SC2016
            board_key=$(jq -r 'sort | join("+")' <<<"$selected_boards")
            # shellcheck disable=SC2016
            scope_spec=$(jq -c \
              --argjson boards "$selected_boards" \
              --arg board_key "$board_key" \
              '. + {
                boards: $boards,
                board_key: $board_key,
                expected_job_count: ($boards | length)
              }' <<<"$scope_spec")
            # shellcheck disable=SC2016
            scoped_jobs=$(find "$LAVA_CI" -name '*.yaml' -print0 |
              jq --compact-output --raw-input --slurp \
                --argjson include "$selected_boards" \
                --argjson scope_spec "$scope_spec" '
                  split("\u0000")[:-1]
                  | map(sub("^ci/lava/"; ""))
                  | map({
                      board: split("/")[0],
                      target: .,
                      slug: (
                        . | sub("\\.yaml$"; "") | gsub("/"; "-")
                      ),
                      name: (
                        . | sub("\\.yaml$"; "") | gsub("/"; " ")
                      )
                    })
                  | map(select(.board as $board | $include | any(. == $board)))
                  | map(. + $scope_spec)
                ')
            # shellcheck disable=SC2016
            jobmatrix=$(jq -c --argjson jobs "$scoped_jobs" \
              '.include += $jobs' <<<"$jobmatrix")
            # shellcheck disable=SC2016
            scopes=$(jq -c --argjson scope_spec "$scope_spec" \
              '. + [$scope_spec]' <<<"$scopes")
          done < <(jq -c '.include[]' <<<"$scope_specs")
          # shellcheck disable=SC2016
          scope_matrix=$(jq -c \
            'map(del(.build_url, .image_source, .boards_include)) | {include: .}' \
            <<<"$scopes")
          echo "jobmatrix=$jobmatrix" >>"$GITHUB_OUTPUT"
          echo "has_jobs=$(jq '.include | length > 0' <<<"$jobmatrix")" >>"$GITHUB_OUTPUT"
          printf '%s\n' "$scope_matrix" >scope-matrix.json

      - name: Upload scope matrix
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lava-scope-matrix-${{ inputs.suite }}-${{ inputs.report_scope }}
          path: scope-matrix.json
          retention-days: 90
          if-no-files-found: error
          overwrite: true

  submit-job:
    needs: prepare-job-list
    if: needs.prepare-job-list.outputs.has_jobs == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    name: Submit ${{ matrix.scope }} / ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-job-list.outputs.jobmatrix) }}
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Download short-lived container URL
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: container-test-url-${{ github.run_id }}
          path: container-url

      - name: Update test definition ${{ matrix.target }}
        env:
          BUILD_URL: ${{ matrix.build_url }}
          TEMPLATE: ${{ env.LAVA_CI }}${{ matrix.target }}
        run: |
          set -euo pipefail
          export CONTAINER_URL
          CONTAINER_URL="$(<container-url/container_url)"
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          from urllib.parse import parse_qs, urlsplit

          url = os.environ["CONTAINER_URL"]
          parsed = urlsplit(url)
          valid_host = (
              parsed.hostname == "qcom-prd-gh-artifacts.s3.amazonaws.com"
              or (
                  parsed.hostname is not None
                  and parsed.hostname.startswith("qcom-prd-gh-artifacts.s3.")
                  and parsed.hostname.endswith(".amazonaws.com")
              )
          )
          path_match = re.fullmatch(
              rf"/{re.escape(os.environ['GITHUB_REPOSITORY'])}/"
              rf"{re.escape(os.environ['GITHUB_RUN_ID'])}-([1-9][0-9]*)/"
              r"aiml-container-test-repository\.tar\.gz",
              parsed.path,
          )
          query = parse_qs(parsed.query)
          if (
              parsed.scheme != "https"
              or not valid_host
              or path_match is None
              or int(path_match.group(1)) > int(os.environ["GITHUB_RUN_ATTEMPT"])
              or "X-Amz-Signature" not in query
              or int(query.get("X-Amz-Expires", ["0"])[0]) > 21600
          ):
              raise SystemExit("container URL failed validation")

          replacements = {
              "{{BUILD_DOWNLOAD_URL}}": os.environ["BUILD_URL"],
              "{{CONTAINER_URL}}": url,
              "{{SUITE}}": os.environ["SUITE"],
              "{{GITHUB_REPOSITORY}}": os.environ["GITHUB_REPOSITORY"],
              "{{GITHUB_RUN_ATTEMPT}}": os.environ["GITHUB_RUN_ATTEMPT"],
              "{{GITHUB_RUN_ID}}": os.environ["GITHUB_RUN_ID"],
              "{{GITHUB_SHA}}": os.environ["GITHUB_SHA"],
          }
          template = Path(os.environ["TEMPLATE"])
          contents = template.read_text()
          for placeholder, value in replacements.items():
              if placeholder not in contents:
                  raise SystemExit(f"missing expected placeholder: {placeholder}")
              contents = contents.replace(placeholder, value)
          unresolved = re.findall(r"{{[^{}]+}}", contents)
          if unresolved:
              raise SystemExit(f"unresolved placeholders: {', '.join(unresolved)}")
          template.write_text(contents)
          PY
          echo "Prepared validated LAVA definition at $TEMPLATE"

      - name: Submit ${{ matrix.target }}
        id: lava_attempt
        continue-on-error: true
        timeout-minutes: 240
        uses: foundriesio/lava-action@3d40f621e0cd5acec50f557783b755f278ca892d # v13
        with:
          lava_token: ${{ secrets.LAVATOKEN }}
          lava_url: 'lava.infra.foundries.io'
          job_definition: ${{ env.LAVA_CI }}${{ matrix.target }}
          wait_for_job: true
          fail_action_on_failure: true
          fail_action_on_incomplete: true
          save_result_as_artifact: true
          save_job_details: true
          result_file_name: test-results-${{ inputs.suite }}-${{ matrix.scope }}-${{ matrix.slug }}
          test_job_file_name_prefix: ${{ inputs.suite }}-${{ github.run_attempt }}-${{ matrix.scope }}-

      - name: Check whether AIML tests ran
        id: first_execution
        if: always()
        continue-on-error: true
        env:
          RESULT_FILE: test-results-${{ inputs.suite }}-${{ matrix.scope }}-${{ matrix.slug }}.xml
        run: python3 ci/check_lava_execution.py "$RESULT_FILE"

      - name: Retry ${{ matrix.target }}
        id: lava_retry
        if: always() && steps.first_execution.outcome == 'failure'
        timeout-minutes: 240
        uses: foundriesio/lava-action@3d40f621e0cd5acec50f557783b755f278ca892d # v13
        with:
          lava_token: ${{ secrets.LAVATOKEN }}
          lava_url: 'lava.infra.foundries.io'
          job_definition: ${{ env.LAVA_CI }}${{ matrix.target }}
          wait_for_job: true
          fail_action_on_failure: true
          fail_action_on_incomplete: true
          save_result_as_artifact: true
          save_job_details: true
          result_file_name: test-results-${{ inputs.suite }}-${{ matrix.scope }}-${{ matrix.slug }}
          test_job_file_name_prefix: ${{ inputs.suite }}-${{ github.run_attempt }}-${{ matrix.scope }}-

      - name: Check final AIML test execution
        id: final_execution
        if: always()
        continue-on-error: true
        env:
          RESULT_FILE: test-results-${{ inputs.suite }}-${{ matrix.scope }}-${{ matrix.slug }}.xml
        run: python3 ci/check_lava_execution.py "$RESULT_FILE"

      - name: Record LAVA execution status
        if: always()
        env:
          BOARD: ${{ matrix.board }}
          FINAL_EXECUTION_OUTCOME: ${{ steps.final_execution.outcome }}
          FIRST_EXECUTION_OUTCOME: ${{ steps.first_execution.outcome }}
          LAVA_ATTEMPT_OUTCOME: ${{ steps.lava_attempt.outcome }}
          LAVA_RETRY_OUTCOME: ${{ steps.lava_retry.outcome }}
          SCOPE: ${{ matrix.scope }}
          SLUG: ${{ matrix.slug }}
        run: |
          set -euo pipefail
          status=success
          if [[ "$FINAL_EXECUTION_OUTCOME" != success ]] ||
             [[ "$LAVA_ATTEMPT_OUTCOME" == failure &&
                "$FIRST_EXECUTION_OUTCOME" == success ]] ||
             [[ "$LAVA_RETRY_OUTCOME" == failure &&
                "$FINAL_EXECUTION_OUTCOME" == success ]]; then
            status=failed
          fi
          jq -n \
            --arg scope "$SCOPE" \
            --arg board "$BOARD" \
            --arg slug "$SLUG" \
            --arg status "$status" \
            --arg lava_attempt "$LAVA_ATTEMPT_OUTCOME" \
            --arg first_execution "$FIRST_EXECUTION_OUTCOME" \
            --arg lava_retry "$LAVA_RETRY_OUTCOME" \
            --arg final_execution "$FINAL_EXECUTION_OUTCOME" \
            '{
              scope: $scope,
              board: $board,
              slug: $slug,
              status: $status,
              lava_attempt: $lava_attempt,
              first_execution: $first_execution,
              lava_retry: $lava_retry,
              final_execution: $final_execution
            }' >lava-execution-status.json

      - name: Upload LAVA execution status
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lava-execution-status-${{ inputs.suite }}-${{ matrix.scope }}-${{ matrix.slug }}
          path: lava-execution-status.json
          retention-days: 90
          if-no-files-found: error
          overwrite: true

      - name: Preserve LAVA test failures
        if: always()
        env:
          FINAL_EXECUTION_OUTCOME: ${{ steps.final_execution.outcome }}
          FIRST_EXECUTION_OUTCOME: ${{ steps.first_execution.outcome }}
          LAVA_ATTEMPT_OUTCOME: ${{ steps.lava_attempt.outcome }}
          LAVA_RETRY_OUTCOME: ${{ steps.lava_retry.outcome }}
        run: |
          if [[ "$LAVA_ATTEMPT_OUTCOME" == failure &&
                "$FIRST_EXECUTION_OUTCOME" == success ]]; then
            echo "AIML tests ran, but the LAVA job reported a test failure" >&2
            exit 1
          fi
          if [[ "$LAVA_RETRY_OUTCOME" == failure &&
                "$FINAL_EXECUTION_OUTCOME" == success ]]; then
            echo "Retried AIML tests ran, but the LAVA job reported a test failure" >&2
            exit 1
          fi
          if [[ "$FINAL_EXECUTION_OUTCOME" != success ]]; then
            echo "AIML tests did not complete successfully" >&2
            exit 1
          fi

  publish-test-results:
    name: Publish Tests Results
    needs: submit-job
    if: always() && needs.submit-job.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: write
      contents: read
      packages: read
    env:
      AIML_REF: ${{ github.head_ref || github.ref_name }}
      CONTAINER_DIGEST: ${{ inputs.container_digest }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Download test results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: test-results-${{ inputs.suite }}-*

      - name: Download scope matrix
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lava-scope-matrix-${{ inputs.suite }}-${{ inputs.report_scope }}
          path: scope-matrix

      - name: Download job details
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: ${{ inputs.suite }}-${{ github.run_attempt }}-*-test-job-*

      - name: Download LAVA execution statuses
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: lava-execution-status-${{ inputs.suite }}-*

      - name: Generate scoped performance reports
        id: reports
        env:
          LAVA_TOKEN: ${{ secrets.LAVATOKEN }}
          SUBMIT_JOB_RESULT: ${{ needs.submit-job.result }}
        run: |
          # shellcheck disable=SC2129
          set -uo pipefail
          mkdir -p report-input performance-current performance-results
          scope_matrix=$(<scope-matrix/scope-matrix.json)
          printf '%s\n' "$scope_matrix" >performance-results/scope-matrix.json
          status_file=performance-results/report-status.json
          printf '{}\n' >"$status_file"
          report_failure=false
          ref_name="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"

          while IFS= read -r scope_spec; do
            scope=$(jq -r '.scope' <<<"$scope_spec")
            board_key=$(jq -r '.board_key' <<<"$scope_spec")
            expected_job_count=$(jq -r '.expected_job_count' <<<"$scope_spec")
            scope_input="report-input/$scope"
            current_output="performance-current/$scope"
            output="performance-results/$scope"
            previous_output="previous-report/$scope"
            diagnostics="$output/diagnostics.md"
            mkdir -p "$scope_input" "$current_output" "$output"
            printf '# LAVA report diagnostics: %s\n\n' "$scope" >"$diagnostics"
            printf -- '- Expected boards: `%s`\n' "$board_key" >>"$diagnostics"

            selected=true
            report_available=false
            incomplete=false
            has_results=false
            baseline_run_id=''
            mapfile -d '' job_files < <(find artifacts -type f \
              -name "${SUITE}-${GITHUB_RUN_ATTEMPT}-${scope}-test-job-*.json" -print0)
            mapfile -d '' status_files < <(find artifacts -type f \
              -name "lava-execution-status-${SUITE}-${scope}-*.json" -print0)
            if find artifacts -type f \
              -name "test-results-${SUITE}-${scope}-*.xml" -print -quit | grep -q .; then
              has_results=true
            fi
            printf -- '- Job details found: %s of at least %s expected\n' \
              "${#job_files[@]}" "$expected_job_count" >>"$diagnostics"
            printf -- '- Execution statuses found: %s of %s expected\n' \
              "${#status_files[@]}" "$expected_job_count" >>"$diagnostics"
            if (( ${#job_files[@]} < expected_job_count )) ||
               (( ${#status_files[@]} < expected_job_count )); then
              incomplete=true
            fi
            for status_file_path in "${status_files[@]}"; do
              if ! jq -e '.status == "success"' "$status_file_path" >/dev/null; then
                incomplete=true
                printf -- '- A board execution reported failure: `%s`\n' \
                  "$(jq -c . "$status_file_path")" >>"$diagnostics"
              fi
            done

            raw_data_complete=true
            for json_file in "${job_files[@]}"; do
              if ! job_id=$(jq -er '.id | tostring | select(test("^[0-9]+$"))' \
                "$json_file"); then
                raw_data_complete=false
                printf -- '- Invalid LAVA job metadata: `%s`\n' "$json_file" >>"$diagnostics"
                continue
              fi
              curl_args=(
                --fail
                --silent
                --show-error
                --retry 3
                --header "Authorization: Token ${LAVA_TOKEN}"
              )
              if ! curl "${curl_args[@]}" \
                "https://lava.infra.foundries.io/api/v0.2/jobs/${job_id}/" \
                --output "$scope_input/job-${job_id}.json" ||
                ! curl "${curl_args[@]}" \
                "https://lava.infra.foundries.io/api/v0.2/jobs/${job_id}/csv/" \
                --output "$scope_input/job-${job_id}-tests.csv" ||
                ! curl "${curl_args[@]}" \
                "https://lava.infra.foundries.io/api/v0.2/jobs/${job_id}/logs/" \
                --output "$scope_input/job-${job_id}.yaml"; then
                raw_data_complete=false
                printf -- '- Could not download LAVA data for job `%s`\n' "$job_id" >>"$diagnostics"
              fi
            done

            qcom_run_id=$(jq -r '.qcom_run_id' <<<"$scope_spec")
            qcom_run_attempt=$(jq -r '.qcom_run_attempt' <<<"$scope_spec")
            qcom_publication_attempt=$(jq -r '.qcom_publication_attempt' <<<"$scope_spec")
            qcom_workflow=$(jq -r '.qcom_workflow' <<<"$scope_spec")
            qcom_event=$(jq -r '.qcom_event' <<<"$scope_spec")
            qcom_ref=$(jq -r '.qcom_ref' <<<"$scope_spec")
            qcom_sha=$(jq -r '.qcom_sha' <<<"$scope_spec")
            report_args=(
              --input-dir "$scope_input"
              --boards ci/boards.json
              --suite "$SUITE"
              --lava-url https://lava.infra.foundries.io
              --qcom-run-id "$qcom_run_id"
              --qcom-run-attempt "$qcom_run_attempt"
              --qcom-publication-attempt "$qcom_publication_attempt"
              --qcom-workflow "$qcom_workflow"
              --qcom-event "$qcom_event"
              --qcom-ref "$qcom_ref"
              --qcom-sha "$qcom_sha"
              --aiml-repository "$GITHUB_REPOSITORY"
              --aiml-ref "$AIML_REF"
              --aiml-sha "$GITHUB_SHA"
              --aiml-run-id "$GITHUB_RUN_ID"
              --aiml-run-attempt "$GITHUB_RUN_ATTEMPT"
              --container-digest "$CONTAINER_DIGEST"
            )
            if (( ${#job_files[@]} == 0 )) || [[ "$raw_data_complete" != true ]]; then
              incomplete=true
            elif ! python3 ci/report_lava_results.py \
              "${report_args[@]}" --output-dir "$current_output" >>"$diagnostics" 2>&1; then
              incomplete=true
              printf -- '- Could not generate the current performance report.\n' >>"$diagnostics"
            else
              artifact_prefix="tflite-performance-${SUITE}-${scope}-"
              if ! artifacts=$(gh api --paginate --method GET \
                "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" |
                jq -sc '{artifacts: [.[].artifacts[]]}'); then
                incomplete=true
                printf -- '- Could not list previous performance report artifacts.\n' >>"$diagnostics"
              else
                mapfile -t candidates < <(jq -r \
                  --arg prefix "$artifact_prefix" \
                  --arg branch "$ref_name" \
                  --argjson run_id "$GITHUB_RUN_ID" '
                    [.artifacts[]
                      | select(.expired == false)
                      | select(.name | startswith($prefix))
                      | select(.workflow_run.id < $run_id)
                      | select(.workflow_run.head_branch == $branch)]
                    | sort_by(.created_at)
                    | reverse
                    | .[]
                    | [.id, .workflow_run.id] | @tsv
                  ' <<<"$artifacts")
                rm -rf "$previous_output" previous-candidate previous-report.zip
                mkdir -p "$(dirname "$previous_output")"
                for candidate in "${candidates[@]}"; do
                  read -r artifact_id candidate_run_id <<<"$candidate"
                  rm -rf previous-candidate previous-report.zip
                  if ! gh api \
                    "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
                    >previous-report.zip ||
                    ! unzip -q previous-report.zip -d previous-candidate; then
                    printf -- '- Skipped unreadable report artifact from run `%s`.\n' \
                      "$candidate_run_id" >>"$diagnostics"
                    continue
                  fi
                  if [[ ! -s previous-candidate/results.json ]]; then
                    printf -- '- Skipped report from run `%s`: missing results.\n' \
                      "$candidate_run_id" >>"$diagnostics"
                    continue
                  fi
                  if python3 ci/select_previous_lava_report.py \
                    --current-results "$current_output/results.json" \
                    --candidate-results previous-candidate/results.json; then
                    mv previous-candidate "$previous_output"
                    baseline_run_id="$candidate_run_id"
                    break
                  fi
                  printf -- '- Skipped incompatible report from run `%s`.\n' \
                    "$candidate_run_id" >>"$diagnostics"
                done
              fi
              previous_args=()
              if [[ -s "$previous_output/results.json" ]]; then
                previous_args+=(--previous-results "$previous_output/results.json")
                printf -- '- Comparison baseline: compatible report from run `%s`.\n' \
                  "$baseline_run_id" >>"$diagnostics"
              else
                printf -- '- Comparison baseline: no earlier semantically compatible report.\n' \
                  >>"$diagnostics"
              fi
              if python3 ci/report_lava_results.py \
                "${report_args[@]}" --output-dir "$output" \
                "${previous_args[@]}" >>"$diagnostics" 2>&1; then
                report_available=true
              else
                incomplete=true
                printf -- '- Could not generate the final performance report.\n' >>"$diagnostics"
              fi
            fi

            if [[ "$incomplete" == true ]]; then
              printf '\n**INCOMPLETE:** One or more LAVA executions or report inputs are unavailable.\n' \
                >>"$diagnostics"
            fi
            jq --arg scope "$scope" \
              --arg board_key "$board_key" \
              --arg baseline_run_id "$baseline_run_id" \
              --argjson selected "$selected" \
              --argjson has_results "$has_results" \
              --argjson report_available "$report_available" \
              --argjson incomplete "$incomplete" \
              '. + {
                ($scope): {
                  board_key: $board_key,
                  baseline_run_id: $baseline_run_id,
                  selected: $selected,
                  has_results: $has_results,
                  report_available: $report_available,
                  incomplete: $incomplete
                }
              }' "$status_file" >"${status_file}.next" &&
              mv "${status_file}.next" "$status_file"
            echo "${scope}_selected=$selected" >>"$GITHUB_OUTPUT"
            echo "${scope}_board_key=$board_key" >>"$GITHUB_OUTPUT"
            echo "${scope}_has_results=$has_results" >>"$GITHUB_OUTPUT"
            echo "${scope}_report_available=$report_available" >>"$GITHUB_OUTPUT"
            if [[ "$incomplete" == true ]]; then
              report_failure=true
            fi
          done < <(jq -c '.include[]' <<<"$scope_matrix")
          if [[ "$SUBMIT_JOB_RESULT" != success ]]; then
            report_failure=true
          fi
          echo "report_failure=$report_failure" >>"$GITHUB_OUTPUT"

      - name: Publish generic Test Results check
        id: publish_generic_check
        if: always() && steps.reports.outputs.generic_selected == 'true' && steps.reports.outputs.generic_has_results == 'true'
        continue-on-error: true
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
        with:
          check_name: LAVA results (generic)
          comment_mode: 'off'
          compare_to_earlier_commit: 'false'
          files: "${{ github.workspace }}/artifacts/**/test-results-${{ inputs.suite }}-generic-*.xml"
          job_summary: 'false'
          json_file: performance-results/generic/test-results.json

      - name: Format generic Test Results check
        id: format_generic_check
        if: always() && steps.publish_generic_check.outcome == 'success' && steps.reports.outputs.generic_report_available == 'true'
        continue-on-error: true
        run: |
          python3 ci/format_test_results.py \
            --performance-summary performance-results/generic/summary.md \
            --test-results performance-results/generic/test-results.json \
            --output performance-results/generic/check-summary.md

      - name: Update generic Test Results check
        id: update_generic_check
        if: always() && steps.format_generic_check.outcome == 'success'
        continue-on-error: true
        env:
          CHECK_NAME: LAVA results (generic)
          CHECK_SUMMARY: performance-results/generic/check-summary.md
        run: |
          set -euo pipefail
          check_runs=$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" \
            -f check_name="$CHECK_NAME" -f filter=latest -f per_page=10)
          check_run_id=$(jq -er '.check_runs[0].id' <<<"$check_runs")
          jq -e --rawfile summary "$CHECK_SUMMARY" '
            {
              output: {
                title: (
                  .check_runs[0].output.title
                  | select(type == "string" and length > 0)
                ),
                summary: $summary
              }
            }' \
            <<<"$check_runs" >check-update.json
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/check-runs/${check_run_id}" \
            --input check-update.json

      - name: Publish Arduino Test Results check
        id: publish_arduino_check
        if: always() && steps.reports.outputs.arduino_selected == 'true' && steps.reports.outputs.arduino_has_results == 'true'
        continue-on-error: true
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
        with:
          check_name: LAVA results (arduino)
          comment_mode: 'off'
          compare_to_earlier_commit: 'false'
          files: "${{ github.workspace }}/artifacts/**/test-results-${{ inputs.suite }}-arduino-*.xml"
          job_summary: 'false'
          json_file: performance-results/arduino/test-results.json

      - name: Format Arduino Test Results check
        id: format_arduino_check
        if: always() && steps.publish_arduino_check.outcome == 'success' && steps.reports.outputs.arduino_report_available == 'true'
        continue-on-error: true
        run: |
          python3 ci/format_test_results.py \
            --performance-summary performance-results/arduino/summary.md \
            --test-results performance-results/arduino/test-results.json \
            --output performance-results/arduino/check-summary.md

      - name: Update Arduino Test Results check
        id: update_arduino_check
        if: always() && steps.format_arduino_check.outcome == 'success'
        continue-on-error: true
        env:
          CHECK_NAME: LAVA results (arduino)
          CHECK_SUMMARY: performance-results/arduino/check-summary.md
        run: |
          set -euo pipefail
          check_runs=$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" \
            -f check_name="$CHECK_NAME" -f filter=latest -f per_page=10)
          check_run_id=$(jq -er '.check_runs[0].id' <<<"$check_runs")
          jq -e --rawfile summary "$CHECK_SUMMARY" '
            {
              output: {
                title: (
                  .check_runs[0].output.title
                  | select(type == "string" and length > 0)
                ),
                summary: $summary
              }
            }' \
            <<<"$check_runs" >check-update.json
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/check-runs/${check_run_id}" \
            --input check-update.json

      - name: Upload generic performance report
        id: upload_generic_report
        if: always() && steps.reports.outputs.generic_selected == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tflite-performance-${{ inputs.suite }}-generic-${{ steps.reports.outputs.generic_board_key }}
          path: performance-results/generic
          retention-days: 90
          if-no-files-found: error
          overwrite: true

      - name: Upload Arduino performance report
        id: upload_arduino_report
        if: always() && steps.reports.outputs.arduino_selected == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tflite-performance-${{ inputs.suite }}-arduino-${{ steps.reports.outputs.arduino_board_key }}
          path: performance-results/arduino
          retention-days: 90
          if-no-files-found: error
          overwrite: true

      - name: Publish aggregated LAVA report
        if: always()
        run: |
          set -euo pipefail
          echo '# TensorFlow Lite test results' >>"$GITHUB_STEP_SUMMARY"
          while IFS= read -r scope_spec; do
            scope=$(jq -r '.scope' <<<"$scope_spec")
            echo >>"$GITHUB_STEP_SUMMARY"
            echo "# Report scope: ${scope}" >>"$GITHUB_STEP_SUMMARY"
            if jq -e --arg scope "$scope" '.[$scope].incomplete' \
              performance-results/report-status.json >/dev/null; then
              echo >>"$GITHUB_STEP_SUMMARY"
              echo '> **INCOMPLETE / UNAVAILABLE:** Some LAVA diagnostics or results are missing; available details follow.' >>"$GITHUB_STEP_SUMMARY"
            fi
            if [[ -s "performance-results/$scope/summary.md" ]]; then
              cat "performance-results/$scope/summary.md" >>"$GITHUB_STEP_SUMMARY"
            else
              echo >>"$GITHUB_STEP_SUMMARY"
              echo '> **UNAVAILABLE:** A complete performance report could not be generated for this scope.' >>"$GITHUB_STEP_SUMMARY"
            fi
            if [[ -s "performance-results/$scope/check-summary.md" ]]; then
              echo >>"$GITHUB_STEP_SUMMARY"
              cat "performance-results/$scope/check-summary.md" >>"$GITHUB_STEP_SUMMARY"
            fi
            if [[ -s "performance-results/$scope/diagnostics.md" ]]; then
              echo >>"$GITHUB_STEP_SUMMARY"
              cat "performance-results/$scope/diagnostics.md" >>"$GITHUB_STEP_SUMMARY"
            fi
          done < <(jq -c '.include[]' performance-results/scope-matrix.json)

      - name: Fail incomplete report publication
        if: always()
        env:
          REPORT_FAILURE: ${{ steps.reports.outputs.report_failure }}
          PUBLISH_GENERIC: ${{ steps.publish_generic_check.outcome }}
          FORMAT_GENERIC: ${{ steps.format_generic_check.outcome }}
          UPDATE_GENERIC: ${{ steps.update_generic_check.outcome }}
          UPLOAD_GENERIC: ${{ steps.upload_generic_report.outcome }}
          PUBLISH_ARDUINO: ${{ steps.publish_arduino_check.outcome }}
          FORMAT_ARDUINO: ${{ steps.format_arduino_check.outcome }}
          UPDATE_ARDUINO: ${{ steps.update_arduino_check.outcome }}
          UPLOAD_ARDUINO: ${{ steps.upload_arduino_report.outcome }}
        run: |
          set -euo pipefail
          failed=false
          [[ "$REPORT_FAILURE" == true ]] && failed=true
          for outcome in \
            "$PUBLISH_GENERIC" "$FORMAT_GENERIC" "$UPDATE_GENERIC" \
            "$UPLOAD_GENERIC" "$PUBLISH_ARDUINO" "$FORMAT_ARDUINO" \
            "$UPDATE_ARDUINO" "$UPLOAD_ARDUINO"; do
            if [[ "$outcome" == failure ]]; then
              failed=true
            fi
          done
          if [[ "$failed" == true ]]; then
            echo 'One or more LAVA scopes or report publication steps failed.' >&2
            exit 1
          fi
