name: Resolve qcom-deb image

on:
  workflow_call:
    inputs:
      run_id:
        description: Successful qcom-deb-images run ID from the last 14 days; empty selects the latest
        required: false
        type: string
      source:
        description: Trusted qcom-deb-images workflow family
        required: false
        default: generic
        type: string
      suite:
        description: Debian suite whose flash image must exist
        required: true
        type: string
    outputs:
      build_url:
        description: Immutable qcom-deb-images artifact prefix
        value: ${{ jobs.resolve.outputs.build_url }}
      run_id:
        description: Selected qcom-deb-images workflow run ID
        value: ${{ jobs.resolve.outputs.run_id }}
      run_attempt:
        description: Selected qcom-deb-images workflow run attempt
        value: ${{ jobs.resolve.outputs.run_attempt }}
      publication_attempt:
        description: Publication attempt parsed from the build_url pointer
        value: ${{ jobs.resolve.outputs.publication_attempt }}
      workflow:
        description: Selected qcom-deb-images workflow path
        value: ${{ jobs.resolve.outputs.workflow }}
      event:
        description: Selected qcom-deb-images workflow event
        value: ${{ jobs.resolve.outputs.event }}
      ref:
        description: Selected qcom-deb-images branch
        value: ${{ jobs.resolve.outputs.ref }}
      sha:
        description: Selected qcom-deb-images commit
        value: ${{ jobs.resolve.outputs.sha }}

permissions: {}

jobs:
  resolve:
    name: Resolve qcom-deb daily image
    runs-on: [self-hosted, qcom-u2404, amd64]
    permissions:
      contents: read
    outputs:
      build_url: ${{ steps.resolve.outputs.build_url }}
      run_id: ${{ steps.resolve.outputs.run_id }}
      run_attempt: ${{ steps.resolve.outputs.run_attempt }}
      publication_attempt: ${{ steps.resolve.outputs.publication_attempt }}
      workflow: ${{ steps.resolve.outputs.workflow }}
      event: ${{ steps.resolve.outputs.event }}
      ref: ${{ steps.resolve.outputs.ref }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Resolve latest successful image build
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RUN_ID: ${{ inputs.run_id }}
          SOURCE: ${{ inputs.source }}
          SUITE: ${{ inputs.suite }}
        run: |
          set -euo pipefail
          python3 ci/resolve_qcom_image.py \
            --source "$SOURCE" \
            --suite "$SUITE" \
            --run-id "$REQUESTED_RUN_ID"
