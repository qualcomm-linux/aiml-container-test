name: Compare LAVA performance

on:
  workflow_call:
    inputs:
      suite:
        description: Debian suite shared by both LAVA report scopes
        required: true
        type: string

permissions: {}

jobs:
  compare:
    name: Publish cross-board comparison
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Download generic performance report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: performance-reports/generic
          pattern: tflite-performance-${{ inputs.suite }}-generic-*

      - name: Download Arduino performance report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: performance-reports/arduino
          pattern: tflite-performance-${{ inputs.suite }}-arduino-*

      - name: Generate board comparison
        run: |
          python3 ci/compare_performance.py \
            --input-dir performance-reports \
            --output-dir performance-comparison
          cat performance-comparison/summary.md >>"$GITHUB_STEP_SUMMARY"

      - name: Upload board comparison
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tflite-performance-${{ inputs.suite }}-board-comparison
          path: performance-comparison
          retention-days: 90
          if-no-files-found: error
          overwrite: true
