name: Build on push to branch

on:
  push:
    branches: [main, ci-staging]

permissions: {}

jobs:
  resolve-qcom-image-generic:
    uses: ./.github/workflows/resolve-qcom-image.yml
    permissions:
      contents: read
    with:
      source: generic
      suite: trixie

  resolve-qcom-image-arduino:
    uses: ./.github/workflows/resolve-qcom-image.yml
    permissions:
      contents: read
    with:
      source: arduino
      suite: trixie

  build-daily:
    uses: ./.github/workflows/docker_build.yml
    permissions:
      contents: read
    with:
      create_test_url: true

  schema-check:
    uses: ./.github/workflows/lava-schema-check.yml
    permissions:
      contents: read

  test-generic:
    uses: ./.github/workflows/lava-test.yml
    needs: [resolve-qcom-image-generic, resolve-qcom-image-arduino, build-daily, schema-check]
    permissions:
      actions: read
      checks: write
      contents: read
      packages: read
    secrets:
      LAVATOKEN: ${{ secrets.LAVATOKEN }}
    with:
      boards_include: '["qrb2210-rb1","qcs6490-rb3gen2-vision-kit"]'
      build_url: ${{ needs.resolve-qcom-image-generic.outputs.build_url }}
      container_digest: ${{ needs.build-daily.outputs.container_digest }}
      image_source: generic
      qcom_event: ${{ needs.resolve-qcom-image-generic.outputs.event }}
      qcom_ref: ${{ needs.resolve-qcom-image-generic.outputs.ref }}
      qcom_run_attempt: ${{ needs.resolve-qcom-image-generic.outputs.run_attempt }}
      qcom_publication_attempt: ${{ needs.resolve-qcom-image-generic.outputs.publication_attempt }}
      qcom_run_id: ${{ needs.resolve-qcom-image-generic.outputs.run_id }}
      qcom_sha: ${{ needs.resolve-qcom-image-generic.outputs.sha }}
      qcom_workflow: ${{ needs.resolve-qcom-image-generic.outputs.workflow }}
      report_scope: generic
      suite: trixie
      additional_boards_include: '["monaco-arduino-monza","qrb2210-arduino-imola"]'
      additional_build_url: ${{ needs.resolve-qcom-image-arduino.outputs.build_url }}
      additional_image_source: arduino
      additional_qcom_event: ${{ needs.resolve-qcom-image-arduino.outputs.event }}
      additional_qcom_ref: ${{ needs.resolve-qcom-image-arduino.outputs.ref }}
      additional_qcom_run_attempt: ${{ needs.resolve-qcom-image-arduino.outputs.run_attempt }}
      additional_qcom_publication_attempt: ${{ needs.resolve-qcom-image-arduino.outputs.publication_attempt }}
      additional_qcom_run_id: ${{ needs.resolve-qcom-image-arduino.outputs.run_id }}
      additional_qcom_sha: ${{ needs.resolve-qcom-image-arduino.outputs.sha }}
      additional_qcom_workflow: ${{ needs.resolve-qcom-image-arduino.outputs.workflow }}
      additional_report_scope: arduino

  compare-performance:
    name: Compare board performance
    needs: [test-generic]
    uses: ./.github/workflows/compare-performance.yml
    permissions:
      actions: read
      contents: read
    with:
      suite: trixie
