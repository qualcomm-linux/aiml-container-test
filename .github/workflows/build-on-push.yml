name: Build on push to branch

on:
  push:
    branches: [main, ci-staging]

permissions: {}

jobs:
  resolve-qcom-image-generic:
    uses: ./.github/workflows/resolve-qcom-image.yml
    permissions:
      contents: read
    with:
      source: generic
      suite: trixie

  resolve-qcom-image-arduino:
    uses: ./.github/workflows/resolve-qcom-image.yml
    permissions:
      contents: read
    with:
      source: arduino
      suite: trixie

  build-daily:
    uses: ./.github/workflows/docker_build.yml
    permissions:
      contents: read
    with:
      create_test_url: true

  schema-check:
    uses: ./.github/workflows/lava-schema-check.yml
    permissions:
      contents: read

  test-generic:
    uses: ./.github/workflows/lava-test.yml
    needs: [resolve-qcom-image-generic, build-daily, schema-check]
    permissions:
      actions: read
      checks: write
      contents: read
      packages: read
    secrets:
      LAVATOKEN: ${{ secrets.LAVATOKEN }}
    with:
      boards_include: '["qrb2210-rb1","qcs6490-rb3gen2-vision-kit"]'
      build_url: ${{ needs.resolve-qcom-image-generic.outputs.build_url }}
      container_digest: ${{ needs.build-daily.outputs.container_digest }}
      image_source: generic
      qcom_event: ${{ needs.resolve-qcom-image-generic.outputs.event }}
      qcom_ref: ${{ needs.resolve-qcom-image-generic.outputs.ref }}
      qcom_run_attempt: ${{ needs.resolve-qcom-image-generic.outputs.run_attempt }}
      qcom_publication_attempt: ${{ needs.resolve-qcom-image-generic.outputs.publication_attempt }}
      qcom_run_id: ${{ needs.resolve-qcom-image-generic.outputs.run_id }}
      qcom_sha: ${{ needs.resolve-qcom-image-generic.outputs.sha }}
      qcom_workflow: ${{ needs.resolve-qcom-image-generic.outputs.workflow }}
      report_scope: generic
      suite: trixie

  test-arduino:
    uses: ./.github/workflows/lava-test.yml
    needs: [resolve-qcom-image-arduino, build-daily, schema-check]
    permissions:
      actions: read
      checks: write
      contents: read
      packages: read
    secrets:
      LAVATOKEN: ${{ secrets.LAVATOKEN }}
    with:
      boards_include: '["monaco-arduino-monza","qrb2210-arduino-imola"]'
      build_url: ${{ needs.resolve-qcom-image-arduino.outputs.build_url }}
      container_digest: ${{ needs.build-daily.outputs.container_digest }}
      image_source: arduino
      qcom_event: ${{ needs.resolve-qcom-image-arduino.outputs.event }}
      qcom_ref: ${{ needs.resolve-qcom-image-arduino.outputs.ref }}
      qcom_run_attempt: ${{ needs.resolve-qcom-image-arduino.outputs.run_attempt }}
      qcom_publication_attempt: ${{ needs.resolve-qcom-image-arduino.outputs.publication_attempt }}
      qcom_run_id: ${{ needs.resolve-qcom-image-arduino.outputs.run_id }}
      qcom_sha: ${{ needs.resolve-qcom-image-arduino.outputs.sha }}
      qcom_workflow: ${{ needs.resolve-qcom-image-arduino.outputs.workflow }}
      report_scope: arduino
      suite: trixie

  compare-performance:
    name: Compare board performance
    needs: [test-generic, test-arduino]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Download performance reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: performance-reports
          pattern: tflite-performance-trixie-*-*

      - name: Generate board comparison
        run: |
          python3 ci/compare_performance.py \
            --input-dir performance-reports \
            --output-dir performance-comparison
          cat performance-comparison/summary.md >>"$GITHUB_STEP_SUMMARY"

      - name: Upload board comparison
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tflite-performance-trixie-board-comparison
          path: performance-comparison
          retention-days: 90
          if-no-files-found: error
          overwrite: true
