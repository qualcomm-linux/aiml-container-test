name: Build OCI container images

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      create_test_url:
        description: Create a short-lived container URL for the LAVA job
        required: false
        type: boolean
        default: false
    outputs:
      artifacts_url:
        description: "URL to retrieve build artifacts"
        value: ${{ jobs.build-oci.outputs.url }}
      container_digest:
        description: Content digest of the tested container image
        value: ${{ jobs.build-oci.outputs.container_digest }}
  workflow_dispatch:
    inputs:
      create_test_url:
        description: Create a short-lived container URL for the LAVA job
        required: false
        type: boolean
        default: false

jobs:
  build-oci:
    name: Build and upload container image(s)
    if: github.repository_owner == 'qualcomm-linux'
    outputs:
      url: ${{ steps.upload_artifacts_s3.outputs.url }}/aiml-container-${{ steps.build_identifier.outputs.identifier }}.tar
      container_digest: ${{ steps.container_metadata.outputs.digest }}
    runs-on: [ self-hosted, qcom-u2404, amd64 ]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Derive and validate build identifier
      id: build_identifier
      env:
        EXPECTED_SHA: ${{ github.sha }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        SOURCE_REF: ${{ github.head_ref || github.ref_name }}
      run: |
        set -euo pipefail

        fail() {
          echo "::error title=Invalid build identity::$1"
          exit 1
        }

        validate_build_identifier() {
          local identifier=$1
          if (( ${#identifier} > 128 )); then
            fail "build identifier exceeds the 128-character Docker tag limit"
          fi
          if [[ "$identifier" == */* || "$identifier" == "." || "$identifier" == ".." ]]; then
            fail "build identifier is not safe as a filename component"
          fi
          if [[ ! "$identifier" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]*$ ]]; then
            fail "build identifier is not a valid Docker tag"
          fi
        }

        if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
          fail "github.sha must be exactly 40 lowercase hexadecimal characters"
        fi
        checkout_sha=$(git rev-parse HEAD)
        if [[ ! "$checkout_sha" =~ ^[0-9a-f]{40}$ ]]; then
          fail "checked-out HEAD must be exactly 40 lowercase hexadecimal characters"
        fi
        if [[ "$checkout_sha" != "$EXPECTED_SHA" ]]; then
          fail "checked-out HEAD does not match github.sha"
        fi

        case "$GITHUB_EVENT_NAME" in
          pull_request)
            if [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
              build_identifier="pr-${PR_NUMBER}"
            else
              fail "pull_request event has a missing or malformed pull request number"
            fi
            expected_ref="refs/pull/${PR_NUMBER}/merge"
            if [[ "$GITHUB_REF_TYPE" != "branch" || "$GITHUB_REF" != "$expected_ref" ]]; then
              fail "pull_request event has unsupported ref '$GITHUB_REF' (expected '$expected_ref')"
            fi
            if [[ -z "$SOURCE_REF" ]]; then
              fail "pull_request event is missing its source branch"
            fi
            ;;
          push)
            if [[ "$GITHUB_REF_TYPE" != "branch" || "$GITHUB_REF" != "refs/heads/${GITHUB_REF_NAME}" ]]; then
              fail "push event has unsupported ref '$GITHUB_REF'"
            fi
            build_identifier="branch-${GITHUB_REF_NAME}"
            validate_build_identifier "$build_identifier"
            case "$GITHUB_REF_NAME" in
              main|ci-staging) ;;
              *) fail "push event uses unsupported branch '$GITHUB_REF_NAME'" ;;
            esac
            ;;
          schedule)
            if [[ "$GITHUB_REF_TYPE" != "branch" || "$GITHUB_REF" != "refs/heads/main" || "$GITHUB_REF_NAME" != "main" ]]; then
              fail "schedule event must run from branch 'main'"
            fi
            build_identifier="branch-main"
            ;;
          workflow_dispatch)
            if [[ "$GITHUB_REF_TYPE" != "branch" || "$GITHUB_REF" != "refs/heads/${GITHUB_REF_NAME}" ]]; then
              fail "workflow_dispatch event has unsupported ref '$GITHUB_REF'"
            fi
            build_identifier="branch-${GITHUB_REF_NAME}"
            validate_build_identifier "$build_identifier"
            case "$GITHUB_REF_NAME" in
              main|ci-staging) ;;
              *) fail "workflow_dispatch event uses unsupported branch '$GITHUB_REF_NAME'" ;;
            esac
            ;;
          *)
            fail "unsupported workflow event '$GITHUB_EVENT_NAME'"
            ;;
        esac

        validate_build_identifier "$build_identifier"
        printf 'identifier=%s\n' "$build_identifier" >>"$GITHUB_OUTPUT"
        printf 'Build identifier: %s\n' "$build_identifier"
        printf 'Build event: %s\n' "$GITHUB_EVENT_NAME"
        printf 'Build Git ref: %s\n' "$GITHUB_REF"
        printf 'Build source branch: %s\n' "$SOURCE_REF"
        printf 'Build pull request: %s\n' "${PR_NUMBER:-none}"
        printf 'Build commit: %s\n' "$EXPECTED_SHA"
        printf 'Workflow run ID: %s (attempt %s)\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
        printf 'Workflow run URL: %s/%s/actions/runs/%s\n' \
          "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"

    - name: Set up Docker
      uses: docker/setup-docker-action@v5
      with:
        daemon-config: |
          {
            "debug": true,
            "features": {
              "containerd-snapshotter": true
            }
          }

    - name: Set up ARM64 emulation
      uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      with:
        platforms: arm64

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build OCI tarball
      timeout-minutes: 150
      uses: docker/build-push-action@v7
      env:
        DOCKER_BUILD_RECORD_UPLOAD: false
        DOCKER_BUILD_SUMMARY: false
      with:
        push: false
        platforms: linux/arm64
        tags: aiml-container-test:${{ steps.build_identifier.outputs.identifier }}
        labels: |
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.ref.name=${{ github.head_ref || github.ref_name }}
          io.github.qualcomm-linux.aiml-container.event=${{ github.event_name }}
          io.github.qualcomm-linux.aiml-container.git-ref=${{ github.ref }}
          io.github.qualcomm-linux.aiml-container.pull-request=${{ github.event.pull_request.number || 'none' }}
          io.github.qualcomm-linux.aiml-container.run-id=${{ github.run_id }}
          io.github.qualcomm-linux.aiml-container.run-attempt=${{ github.run_attempt }}
          io.github.qualcomm-linux.aiml-container.run-url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        target: npu-deploy
        cache-from: type=gha
        cache-to: type=gha,mode=max
        outputs: type=docker,dest=${{ runner.temp }}/aiml-container-${{ steps.build_identifier.outputs.identifier }}.tar

    - name: Record container image digest
      id: container_metadata
      env:
        IMAGE_TAR: ${{ runner.temp }}/aiml-container-${{ steps.build_identifier.outputs.identifier }}.tar
      run: |
        set -euo pipefail
        config_file=$(tar -xOf "$IMAGE_TAR" manifest.json | jq -er '.[0].Config')
        config_digest=$(tar -xOf "$IMAGE_TAR" "$config_file" |
          sha256sum | awk '{ print $1 }')
        [[ "$config_digest" =~ ^[0-9a-f]{64}$ ]]
        echo "digest=sha256:${config_digest}" >>"$GITHUB_OUTPUT"

    - name: Stage OCI artifacts for publishing
      env:
        BUILD_IDENTIFIER: ${{ steps.build_identifier.outputs.identifier }}
        EVENT_NAME: ${{ github.event_name }}
        EXPECTED_SHA: ${{ github.sha }}
        GIT_REF: ${{ github.ref }}
        IMAGE_TAR: ${{ runner.temp }}/aiml-container-${{ steps.build_identifier.outputs.identifier }}.tar
        PR_NUMBER: ${{ github.event.pull_request.number }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
        RUN_ID: ${{ github.run_id }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        SOURCE_REF: ${{ github.head_ref || github.ref_name }}
        STAGED_IMAGE_TAR: OCI-artifacts/aiml-container-${{ steps.build_identifier.outputs.identifier }}.tar
      run: |
        set -euxo pipefail
        mkdir -v OCI-artifacts
        cp -v "$IMAGE_TAR" "$STAGED_IMAGE_TAR"
        {
          printf 'identifier=%s\n' "$BUILD_IDENTIFIER"
          printf 'event=%s\n' "$EVENT_NAME"
          printf 'git_ref=%s\n' "$GIT_REF"
          printf 'source_ref=%s\n' "$SOURCE_REF"
          printf 'pull_request=%s\n' "${PR_NUMBER:-none}"
          printf 'github_sha=%s\n' "$EXPECTED_SHA"
          printf 'run_id=%s\n' "$RUN_ID"
          printf 'run_attempt=%s\n' "$RUN_ATTEMPT"
          printf 'run_url=%s\n' "$RUN_URL"
        } >OCI-artifacts/build-provenance.txt

        repository="${RUNNER_TEMP}/aiml-test-repository"
        rm -rf -- "$repository"
        mkdir -v "$repository"
        cp -v "$IMAGE_TAR" "$repository/aiml-container.tar"
        cp -v ci/test-definitions/aiml-container-smoke.yaml "$repository/"
        cdi_generator_commit=54c3cac049cee5afb1b983596d5dda6802b0d568
        curl --fail --location --retry 3 \
          --output "$repository/qualcomm-cdi-generator.py" \
          "https://raw.githubusercontent.com/qualcomm-linux/qualcomm-CDI-generator/${cdi_generator_commit}/qualcomm-cdi-generator.py"
        curl --fail --location --retry 3 \
          --output "$repository/qualcomm-cdi-generator.LICENSE.txt" \
          "https://raw.githubusercontent.com/qualcomm-linux/qualcomm-CDI-generator/${cdi_generator_commit}/LICENSE.txt"
        printf '%s  %s\n' \
          db3c538504e6a156838734ac7ada11a7d99ff65af35705830f8a66deb34c2d46 "$repository/qualcomm-cdi-generator.py" \
          44c38c8e8170268d5c1469c359f46b0a4e11a53f7d68b5a561030c9044b1bb0d "$repository/qualcomm-cdi-generator.LICENSE.txt" |
          sha256sum --check --strict
        chmod 0755 "$repository/qualcomm-cdi-generator.py"
        tar -C "$repository" -cf - . |
          gzip -1 >OCI-artifacts/aiml-container-test-repository.tar.gz
        test -s OCI-artifacts/aiml-container-test-repository.tar.gz

    - name: Build container and push to registry
      uses: docker/build-push-action@v7
      env:
        DOCKER_BUILD_RECORD_UPLOAD: false
        DOCKER_BUILD_SUMMARY: false
      with:
        push: false
        platforms: linux/arm64
        tags: ghcr.io/qualcomm-linux/aiml-container-test:${{ steps.build_identifier.outputs.identifier }}
        labels: |
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.ref.name=${{ github.head_ref || github.ref_name }}
          io.github.qualcomm-linux.aiml-container.event=${{ github.event_name }}
          io.github.qualcomm-linux.aiml-container.git-ref=${{ github.ref }}
          io.github.qualcomm-linux.aiml-container.pull-request=${{ github.event.pull_request.number || 'none' }}
          io.github.qualcomm-linux.aiml-container.run-id=${{ github.run_id }}
          io.github.qualcomm-linux.aiml-container.run-attempt=${{ github.run_attempt }}
          io.github.qualcomm-linux.aiml-container.run-url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        target: npu-deploy
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # Syft is not packaged in Debian; it's available as a binary tarball or
    # as container image from upstream; it's available on arm64 and x86
    - name: Install Syft
      run: |
        set -ux
        sudo apt -y install curl
        curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sudo sh

    - name: Generate SBOMs with Syft
      env:
        BUILD_IDENTIFIER: ${{ steps.build_identifier.outputs.identifier }}
        STAGED_IMAGE_TAR: OCI-artifacts/aiml-container-${{ steps.build_identifier.outputs.identifier }}.tar
      run: |
        set -ux
        bin/syft --version
        SYFT_FORMAT_PRETTY=true bin/syft \
            -o cyclonedx-json=container-sbom.cyclonedx.json \
            -o spdx-json=container-sbom.spdx.json \
            -o syft-json=container-sbom.syft.json \
            -o syft-text=container-sbom.syft.txt \
            -o syft-table \
            --parallelism `nproc` \
            --select-catalogers "+dpkg-db-cataloger,+python-package-cataloger" \
            --source-name aiml-container \
            --source-version "${BUILD_IDENTIFIER}" \
            -v \
            "$STAGED_IMAGE_TAR"

    - name: Stage SBOMs for publishing
      run: |
        set -ux
        gzip container-sbom.*
        dir="sboms"
        mkdir -v sboms
        cp -av container-sbom.*.gz sboms

    - name: Upload SBOMs as private artifacts
      uses: qualcomm-linux/upload-private-artifact-action@aws-v4
      id: upload_sbom_artifacts
      with:
        destination: ${{ github.repository_owner }}/${{ github.event.repository.name }}/${{ github.run_id }}-${{ github.run_attempt }}/
        s3_bucket: qcom-prd-gh-artifacts
        path: sboms

    # upload OCI tarnall to a cloud storage space accessible by LAVA and developers
    - name: Upload private artifacts (S3)
      uses: qualcomm-linux/upload-private-artifact-action@aws-v4
      id: upload_artifacts_s3
      with:
        destination: ${{ github.repository_owner }}/${{ github.event.repository.name }}/${{ github.run_id }}-${{ github.run_attempt }}/
        s3_bucket: qcom-prd-gh-artifacts
        path: OCI-artifacts

    - name: Create short-lived LAVA download URL
      if: inputs.create_test_url
      env:
        ARTIFACT_FILE: aiml-container-test-repository.tar.gz
        DESTINATION: ${{ github.repository_owner }}/${{ github.event.repository.name }}/${{ github.run_id }}-${{ github.run_attempt }}
        S3_BUCKET: qcom-prd-gh-artifacts
      run: |
        set -euo pipefail
        command -v aws >/dev/null
        aws sts get-caller-identity >/dev/null
        object_key="${DESTINATION}/${ARTIFACT_FILE}"
        aws s3api head-object --bucket "$S3_BUCKET" --key "$object_key" >/dev/null
        url="$(aws s3 presign "s3://${S3_BUCKET}/${object_key}" --expires-in 21600)"
        case "$url" in
          https://*) ;;
          *) echo "::error::AWS did not return an HTTPS URL"; exit 1 ;;
        esac
        printf '%s\n' "$url" >"${RUNNER_TEMP}/container_url"

    - name: Upload short-lived LAVA download URL
      if: inputs.create_test_url
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: container-test-url-${{ github.run_id }}
        path: ${{ runner.temp }}/container_url
        retention-days: 1
        if-no-files-found: error
        overwrite: true

    - name: "Print output"
      env:
        build_url: ${{ steps.upload_artifacts_s3.outputs.url }}
      run: |
        echo "Downloads URL: ${build_url}"
        echo "url=\"${build_url}\"" >> $GITHUB_OUTPUT
        echo "${build_url}" > build_url
