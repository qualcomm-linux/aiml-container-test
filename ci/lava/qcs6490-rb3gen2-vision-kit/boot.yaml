actions:
- deploy:
    rootfs_image: disk-ufs.img2
    qcomflash:
      headers:
        QLIAuthorization: Q_QLI_S3_TOKEN
      url: "{{BUILD_DOWNLOAD_URL}}/{{SUITE}}-flash-ufs.tar.gz"
      apply-overlay: true
    timeout:
      minutes: 20
    to: qdl
- boot:
    firehose_program: prog_firehose_ddr.elf
    rawprogram: rawprogram0.xml rawprogram1.xml rawprogram2.xml rawprogram3.xml rawprogram4.xml rawprogram5.xml
    patch: patch0.xml patch1.xml patch2.xml patch3.xml patch4.xml patch5.xml
    path: flash_qcs6490-rb3gen2-vision-kit_ufs
    storage: ufs
    debug: true
    timeout:
      minutes: 15
    method: qdl
- command:
    name: network_turn_on
- boot:
    auto_login:
      login_prompt: 'login:'
      username: debian
      password_prompt: 'Password'
      password: debian
      login_commands:
      - "debian"
      - "new password"
      - "new password"
      - sudo su
    method: minimal
    prompts:
    - root@debian
    - debian@debian
    - "Current password"
    - "New password"
    - "Retype new password"
    timeout:
      minutes: 3
- test:
    timeout:
      minutes: 45
    definitions:
    - from: git
      name: "smoke-test"
      path: automated/linux/smoke/smoke.yaml
      repository: https://github.com/linaro/test-definitions.git
      parameters:
        SKIP_INSTALL: "True"
        TESTS: "pwd, uname -a, ip a"
    - from: git
      name: "wlan-smoke-test"
      path: automated/linux/wlan-smoke/wlan-smoke.yaml
      repository: https://github.com/linaro/test-definitions.git
      parameters:
        SKIP_INSTALL: "True"
    - from: url
      name: "aiml-container-smoke"
      path: aiml-container-smoke.yaml
      repository: "{{CONTAINER_URL}}"
      compression: gz
context:
  lava_test_results_dir: /home/lava-%s
  test_character_delay: 10
device_type: qcs6490-rb3gen2-vision-kit
job_name: AIML container {{SUITE}} {{GITHUB_REPOSITORY}} {{GITHUB_RUN_ID}}-{{GITHUB_RUN_ATTEMPT}}
metadata:
  build-commit: '{{GITHUB_SHA}}'
priority: 50
tags:
- cambridge-lab
timeouts:
  connection:
    minutes: 45
  job:
    minutes: 210
visibility: personal
